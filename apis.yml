name: Rocket Lab
description: Rocket Lab (Rocket Lab Corporation, formerly Rocket Lab USA; Nasdaq RKLB) is an
  American aerospace manufacturer and end-to-end space company founded in 2006 by Peter Beck. It
  designs and launches the Electron small-lift orbital rocket, is developing the reusable Neutron
  medium-lift vehicle, and builds the Photon spacecraft platform along with satellites, spacecraft
  components, solar cells, reaction wheels, star trackers, separation systems and other space
  systems. Rocket Lab operates launch complexes in Mahia, New Zealand and at Wallops Island,
  Virginia, providing dedicated and rideshare launch services plus on-orbit management for
  commercial, civil and national-security customers. It was added to the API Evangelist network
  as a portfolio company of Khosla Ventures; this profile is enriched from public identity and
  live domain probes only, as Rocket Lab publishes no public developer API surface.
